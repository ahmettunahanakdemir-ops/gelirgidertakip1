[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # Public Firebase web configuration only; keep all other secret checks enabled.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyBkhk7kETuMLlvY705BBz5mFH73P1Zp3YA"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
